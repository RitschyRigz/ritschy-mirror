<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RitschyMirror</title>
<style>
  :root { --bg:#1b1d22; --card:#23262d; --line:#33373f; --txt:#e7eaf0; --mut:#9aa3b2;
          --accent:#0ea5e9; --on:#22c55e; --off:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:13px/1.4 "Segoe UI",system-ui,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:12px; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.2px; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--mut); margin-left:auto; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--off); box-shadow:0 0 6px rgba(0,0,0,.4); }
  .dot.on { background:var(--on); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; }
  .card h2 { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--mut);
             margin:0 0 8px; font-weight:600; }
  .card h2 small { text-transform:none; letter-spacing:0; color:var(--mut); font-weight:400; }
  button.toggle { width:100%; padding:12px; font-size:14px; font-weight:600; border:none; border-radius:10px;
                  color:#fff; background:var(--on); cursor:pointer; transition:filter .15s; }
  button.toggle.stopped { background:var(--accent); }
  button.toggle:hover { filter:brightness(1.08); }
  button.toggle:disabled { opacity:.5; cursor:default; }
  .row { display:flex; align-items:center; gap:8px; margin:7px 0; }
  .row label { flex:0 0 98px; color:var(--mut); font-size:12px; }
  select, input[type=range], input[type=number] { flex:1; background:#171a1f; color:var(--txt);
      border:1px solid var(--line); border-radius:7px; padding:5px 7px; min-width:0; }
  input[type=range] { padding:0; accent-color:var(--accent); }
  input[type=checkbox] { width:16px; height:16px; accent-color:var(--accent); }
  .chk { display:flex; align-items:center; gap:8px; margin:8px 0; cursor:pointer; }
  .chk span { color:var(--txt); font-size:12.5px; }
  .val { flex:0 0 46px; text-align:right; color:var(--mut); font-variant-numeric:tabular-nums; }
  .hint { color:var(--mut); font-size:11px; margin-top:6px; }
  .iconbtn { flex:0 0 auto; background:#171a1f; border:1px solid var(--line); color:var(--txt);
             border-radius:7px; padding:5px 9px; cursor:pointer; }
  .err { color:var(--off); font-size:12px; }
  footer { text-align:center; color:var(--mut); font-size:11px; margin-top:4px; }
  footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RitschyMirror</h1>
    <span class="pill"><span id="dot" class="dot"></span><span id="state">verbinde…</span></span>
  </header>

  <div class="card">
    <button id="toggle" class="toggle stopped" disabled>—</button>
    <div id="conn" class="hint"></div>
  </div>

  <div class="card">
    <h2>Monitore <small>(Wechsel = Neustart)</small></h2>
    <div class="row"><label>Quelle</label><select id="src"></select></div>
    <div class="row"><label>Ziel</label><select id="dst"></select>
      <button class="iconbtn" id="refresh" title="Aktualisieren">↻</button></div>
  </div>

  <div class="card">
    <h2>Layout &amp; Ausgabe <small>(Ausgabe/Bit-Tiefe/Fenster = Neustart)</small></h2>
    <div class="row"><label>Layout</label>
      <select id="layout_mode" data-kind="live">
        <option value="fit">fit (1:1)</option><option value="stretch">stretch</option>
        <option value="top_strip">top_strip</option><option value="crop_region">crop_region</option>
      </select></div>
    <div class="row"><label>Ausgabe</label>
      <select id="output_mode" data-kind="struct">
        <option value="windowed">windowed</option><option value="borderless">borderless</option>
        <option value="fullscreen_block">fullscreen_block</option><option value="exclusive">exclusive</option>
      </select></div>
    <div class="row"><label>Bit-Tiefe</label>
      <select id="output_bit_depth" data-kind="struct"><option value="8">8</option><option value="10">10</option></select></div>
    <div class="row"><label>Fenster B×H</label>
      <input type="number" id="window_width" data-kind="struct" min="320" max="7680" step="16" style="flex:0 0 86px">
      <input type="number" id="window_height" data-kind="struct" min="240" max="4320" step="16" style="flex:0 0 86px"></div>
  </div>

  <div class="card">
    <h2>Bild / Tonemap <small>(live)</small></h2>
    <label class="chk"><input type="checkbox" id="tonemap_enabled"><span>Tonemap aktiv (HDR→SDR)</span></label>
    <div class="row"><label>Operator</label>
      <select id="operator">
        <option value="bt2390">bt2390</option><option value="reinhard">reinhard</option>
        <option value="hable">hable</option><option value="aces">aces</option>
      </select></div>
    <div class="row"><label>Sättigung</label><input type="range" id="saturation" min="0" max="2" step="0.01"><span class="val" id="saturation_v"></span></div>
    <div class="row"><label>Kontrast</label><input type="range" id="contrast" min="0" max="2" step="0.01"><span class="val" id="contrast_v"></span></div>
    <div class="row"><label>Gamma</label><input type="range" id="gamma" min="0.3" max="3" step="0.01"><span class="val" id="gamma_v"></span></div>
    <div class="row"><label>Belichtung</label><input type="range" id="exposure" min="-3" max="3" step="0.01"><span class="val" id="exposure_v"></span></div>
    <div class="row"><label>Weißpunkt</label><input type="range" id="target_paperwhite" min="80" max="400" step="1"><span class="val" id="target_paperwhite_v"></span></div>
    <div class="row"><label>Quell-Spitze</label><input type="range" id="source_peak_nits" min="200" max="4000" step="10"><span class="val" id="source_peak_nits_v"></span></div>
    <div class="row"><label>Vert.-Offset</label><input type="number" id="content_offset_y" min="-2160" max="2160" step="2" style="flex:0 0 86px"><span class="hint" style="margin:0">px</span></div>
    <label class="chk"><input type="checkbox" id="show_cursor"><span>Mauszeiger anzeigen</span></label>
    <label class="chk"><input type="checkbox" id="vsync"><span>VSync</span></label>
  </div>

  <div class="card">
    <h2>Crop <small>(live) — Layout „crop_region"</small></h2>
    <div class="row"><label>X</label><input type="range" id="crop_x" min="0" max="1" step="0.01"><span class="val" id="crop_x_v"></span></div>
    <div class="row"><label>Y</label><input type="range" id="crop_y" min="0" max="1" step="0.01"><span class="val" id="crop_y_v"></span></div>
    <div class="row"><label>Breite</label><input type="range" id="crop_w" min="0.05" max="1" step="0.01"><span class="val" id="crop_w_v"></span></div>
    <div class="row"><label>Höhe</label><input type="range" id="crop_h" min="0.05" max="1" step="0.01"><span class="val" id="crop_h_v"></span></div>
  </div>

  <footer>RitschyMirror · <a href="https://github.com/RitschyRigz/ritschy-mirror" target="_blank">GitHub</a></footer>
</div>

<script>
const $ = id => document.getElementById(id);
let displays = [], booted = false, busy = false, lastConfig = null;
const running = () => $("toggle").dataset.running === "1";

async function api(path, method = "GET", body) {
  const opt = { method };
  if (body) { opt.headers = { "Content-Type": "application/json" }; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.status === 204 ? null : r.json();
}
const showErr = () => { $("conn").innerHTML = '<span class="err">Agent nicht erreichbar</span>'; };
// LIVE wirkt sofort; STRUCT braucht einen Render-Neustart, wenn gerade gespiegelt wird.
const patch = (obj) => api("/config", "POST", obj).then(applyStatus).catch(showErr);
async function patchStruct(obj) {
  try { await api("/config", "POST", obj); if (running()) await api("/restart", "POST"); await poll(); }
  catch (e) { showErr(); }
}

const DEC = { target_paperwhite:0, source_peak_nits:0 };
const fmt = (id, v) => { const e = $(id + "_v"); if (e) e.textContent = Number(v).toFixed(DEC[id] ?? 2); };

// ── Live-Slider (Bild + Crop) ──
const SLIDERS = ["saturation","contrast","gamma","exposure","target_paperwhite","source_peak_nits",
                 "crop_x","crop_y","crop_w","crop_h"];
SLIDERS.forEach(id => {
  const el = $(id);
  el.addEventListener("input", () => fmt(id, el.value));
  el.addEventListener("change", () => patch({ [id]: (DEC[id] === 0 ? parseInt(el.value,10) : parseFloat(el.value)) }));
});

// ── Live-Checkboxen + Selects ──
["tonemap_enabled","show_cursor","vsync"].forEach(id =>
  $(id).addEventListener("change", e => patch({ [id]: e.target.checked })));
$("operator").addEventListener("change", e => patch({ operator: e.target.value }));
$("layout_mode").addEventListener("change", e => patch({ layout_mode: e.target.value }));
$("content_offset_y").addEventListener("change", e => patch({ content_offset_y: parseInt(e.target.value || "0", 10) }));

// ── Struct-Felder (Neustart wenn aktiv) ──
$("output_mode").addEventListener("change", e => patchStruct({ output_mode: e.target.value }));
$("output_bit_depth").addEventListener("change", e => patchStruct({ output_bit_depth: parseInt(e.target.value,10) }));
$("window_width").addEventListener("change", e => patchStruct({ window_width: parseInt(e.target.value||"1280",10) }));
$("window_height").addEventListener("change", e => patchStruct({ window_height: parseInt(e.target.value||"720",10) }));

// ── Monitore (Identität wie die App, Neustart wenn aktiv) ──
async function pickMonitor(which) {
  const d = displays[$(which).selectedIndex];
  if (!d) return;
  const body = which === "src"
    ? { source_key: d.key, source_label: d.friendly, source_display: d.index }
    : { target_key: d.key, target_label: d.friendly, target_display: d.index };
  await patchStruct(body);
}
$("src").addEventListener("change", () => pickMonitor("src"));
$("dst").addEventListener("change", () => pickMonitor("dst"));

$("toggle").addEventListener("click", async () => {
  if (busy) return; busy = true;
  try { applyStatus(await api(running() ? "/stop" : "/start", "POST")); } catch (e) { showErr(); }
  busy = false;
});
$("refresh").addEventListener("click", loadDisplays);

async function loadDisplays() {
  try {
    displays = await api("/displays");
    for (const which of ["src","dst"]) {
      const sel = $(which); sel.innerHTML = "";
      displays.forEach(d => {
        const o = document.createElement("option");
        o.textContent = `${d.index}: ${d.friendly || d.name} ${d.resolution}${d.hdr ? " HDR" : ""}`;
        sel.appendChild(o);
      });
    }
    syncMonitorSelection(lastConfig);
  } catch (e) { showErr(); }
}

function syncMonitorSelection(cfg) {
  if (!cfg || !displays.length) return;
  const find = (key, label, idx) => {
    let i = displays.findIndex(d => d.key && d.key === key);
    if (i < 0 && label) { const m = displays.filter(d => d.friendly === label); if (m.length === 1) i = m[0].index; }
    return i >= 0 ? i : (idx < displays.length ? idx : 0);
  };
  $("src").selectedIndex = find(cfg.source_key, cfg.source_label, cfg.source_display || 0);
  $("dst").selectedIndex = find(cfg.target_key, cfg.target_label, cfg.target_display || 0);
}

function applyStatus(st) {
  if (!st) return;
  $("conn").textContent = "";
  const run = !!st.running;
  $("dot").className = "dot" + (run ? " on" : "");
  $("state").textContent = run ? "läuft" : "gestoppt";
  const t = $("toggle");
  t.dataset.running = run ? "1" : "0";
  t.textContent = run ? "■  Mirror stoppen" : "▶  Mirror starten";
  t.className = "toggle" + (run ? "" : " stopped");
  t.disabled = false;
  const cfg = st.config || {}; lastConfig = cfg;
  if (!booted) {  // Steuerelemente EINMAL aus der Config initialisieren (kein Drag-Clobber)
    booted = true;
    SLIDERS.forEach(id => { if (cfg[id] != null) { $(id).value = cfg[id]; fmt(id, cfg[id]); } });
    ["tonemap_enabled","show_cursor","vsync"].forEach(id => { if (cfg[id] != null) $(id).checked = !!cfg[id]; });
    ["operator","layout_mode","output_mode"].forEach(id => { if (cfg[id]) $(id).value = cfg[id]; });
    if (cfg.output_bit_depth != null) $("output_bit_depth").value = String(cfg.output_bit_depth);
    if (cfg.window_width != null) $("window_width").value = cfg.window_width;
    if (cfg.window_height != null) $("window_height").value = cfg.window_height;
    if (cfg.content_offset_y != null) $("content_offset_y").value = cfg.content_offset_y;
    syncMonitorSelection(cfg);
  }
}

async function poll() { try { applyStatus(await api("/status")); } catch (e) { showErr(); } }
loadDisplays(); poll(); setInterval(poll, 2000);
</script>
</body>
</html>
